<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeekLib - Iniciar Sesión</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #1e293b;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      border-radius: 0.75rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 0.25rem; color: #0f172a; font-size: 1.6rem; text-align: center; }
    p.sub { margin: 0 0 1.5rem; color: #64748b; text-align: center; font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.35rem; }
    input {
      width: 100%; padding: 0.65rem 0.8rem; border: 1px solid #cbd5e1;
      border-radius: 0.45rem; font-size: 0.95rem; margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
    button {
      width: 100%; padding: 0.75rem; background: #2563eb; color: white;
      border: none; border-radius: 0.45rem; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #err { color: #dc2626; font-size: 0.88rem; margin-bottom: 1rem; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SeekLib</h1>
    <p class="sub">Control de Asistencia Biométrico y RFID</p>
    <div id="err"></div>
    <form id="loginForm">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="admin@seeklib.local" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" required>
      <button type="submit">Entrar al Panel</button>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("err");
      errBox.style.display = "none";
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          correo: document.getElementById("correo").value,
          password: document.getElementById("password").value
        })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        window.location.href = "/";
      } else {
        errBox.textContent = data.error || "Error al iniciar sesión";
        errBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
